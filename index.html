</style><main><header><h1>Petting Spots</h1><button id="lang"></button></header><section class="scene"><div class="info"><h2 id="name"></h2><span class="status" role="status" id="status"></span></div><canvas aria-hidden="true"></canvas></section><p id="hint"></p><nav class="animals" aria-label="Animals"></nav><details><summary></summary><select aria-label="Body area"></select><button id="pet"></button></details></main>

{paws:[210,214,48,12,2],tail:[327,57,48,35,2],muzzle:[149,61,15,12,2],earBase:[190,46,14,12,1],belly:[272,151,30,14,2],chest:[181,119,19,35,0],shoulder:[216,111,24,34,0],neck:[183,84,25,20,0],back:[264,91,45,20,1]},
{chin:[182,306,13,9,0],cheek:[188,291,15,13,0],forehead:[183,275,12,10,0],earBase:[204,275,13,11,0],tailBase:[340,328,14,14,1],back:[276,316,47,15,1],belly:[275,370,38,13,2],paws:[226,440,25,9,2],tail:[399,402,32,12,2]},
{forehead:[213,483,22,14,0],cheek:[205,520,18,18,1],shoulder:[268,530,18,23,1],back:[305,507,35,13,0],belly:[285,591,27,10,2],paws:[237,612,22,8,2],tail:[373,584,12,12,2],rump:[350,551,23,27,2]},
{forehead:[211,656,20,12,0],shoulder:[244,686,20,18,0],cheek:[199,695,17,16,1],back:[290,664,30,12,1],belly:[265,741,27,12,2],paws:[226,762,20,8,2],rump:[337,707,22,30,2]},
{ears:[141,787,15,14,2],muzzle:[125,847,12,13,2],forehead:[143,808,13,14,1],neck:[175,834,22,22,0],withers:[218,832,19,12,0],shoulder:[211,862,19,29,0],chest:[197,890,13,21,1],back:[266,842,30,12,1],belly:[269,904,28,12,2],legs:[209,954,12,53,2],rump:[340,866,25,30,2]}];

const extraRegions=[
[['paws',[299,214,17,9]],['paws',[362,216,17,10]],['tail',[350,76,29,18]]],
[['paws',[312,438,19,10]],['paws',[350,441,18,10]],['tail',[375,378,14,23]],['tail',[425,402,13,9]]],
[['paws',[324,609,29,9]]],
[['paws',[334,756,22,10]]],
[['legs',[314,960,13,52]],['legs',[348,957,13,53]],['legs',[191,983,10,27]]]
];
const bounds=[[0,233],[234,459],[460,632],[634,773],[766,1024]];
const anchors=[[[180,65,300,125],[615,67,766,123]],[[190,292,310,346],[642,279,776,346]],[[206,504,325,554],[648,568,785,554]],[[203,686,315,710],[650,714,780,709]],[[148,817,298,871],[573,910,744,867]]];
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),nav=document.querySelector('nav'),select=document.querySelector('select'),summary=document.querySelector('summary');
let species=0,locale=0,pose=0,response=0,until=0,count=0,lastTouch=-9999,lastZone='',start=0,oldPose=0,gesture=null,transform=null;
const motion=matchMedia('(prefers-reduced-motion: reduce)');
const images=art.map(row=>row.map(src=>{let i=new Image();i.src=src;return i}));
const tweens=tweenURLs.map(row=>row.map(url=>{let img=new Image();img.src=url;return img}));
function label(k){return locale?words[k]:({earBase:'base of ears',tailBase:'base of tail'}[k]||k)}
function update(){document.documentElement.lang=locale?'zh-Hant':'en';lang.textContent=locale?'English':'繁體中文';document.querySelector('#name').textContent=names[locale][species];document.querySelector('#status').textContent=captions[locale][response];hint.textContent=locale?'輕點或撫摸牠，看看牠怎麼回應。':'Tap or stroke the animal and watch how it responds.';summary.textContent=locale?'選擇部位來撫摸':'Pet by body area';pet.textContent=locale?'輕撫':'Pet';select.setAttribute('aria-label',locale?'身體部位':'Body area');nav.setAttribute('aria-label',locale?'動物':'Animals');let key=select.value;select.replaceChildren(...Object.keys(zones[species]).map(k=>new Option(label(k),k)));if(zones[species][key])select.value=key;nav.replaceChildren(...images.map((row,i)=>{let b=document.createElement('button'),pic=new Image();pic.src=row[0].src;pic.alt='';b.append(pic,names[locale][i]);b.setAttribute('aria-pressed',String(i===species));b.onclick=()=>{species=i;pose=oldPose=response=count=until=0;gesture=null;lastZone='';lastTouch=-9999;update();nav.children[i].focus({preventScroll:true})};return b}))}
function react(p,r,ms){oldPose=pose;pose=p;response=r;start=performance.now();until=start+ms;document.querySelector('#status').textContent=captions[locale][r]}
function touch(k,reverse=false){if(!k||response===3)return;let t=performance.now();count=k===lastZone&&t-lastTouch<3500?count+1:1;lastZone=k;lastTouch=t;let level=zones[species][k][4];if(species===3&&reverse)level=2;if(level===2||level===1&&count>=3)react(2,3,2400);else if(level===1&&count===2)react(0,2,1300);else react(1,1,1800)}
function point(e){let r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function hit(x,y){if(!transform||pose===2)return;let [s,l,t]=transform;let px=(x-l)/s,py=(y-t)/s+bounds[species][0];let [a,b]=anchors[species];let tests=[...Object.entries(zones[species]),...extraRegions[species]];for(let [key,[cx,cy,rx,ry]] of tests){let head=Math.max(0,Math.min(1,(a[2]-cx)/(a[2]-a[0])));let f=motion.matches?1:Math.min(1,(performance.now()-start)/560);let lift=(pose===1?f:0)+(oldPose===1?1-f:0);if(lift){cx+=lift*((b[0]-512-a[0])*head+(b[2]-512-a[2])*(1-head));cy+=lift*((b[1]-a[1])*head+(b[3]-a[3])*(1-head))}if(((px-cx)/rx)**2+((py-cy)/ry)**2<=1)return key}}
canvas.onpointerdown=e=>{if(!e.isPrimary)return;let [x,y]=point(e);gesture={x,y,time:performance.now(),id:e.pointerId};canvas.setPointerCapture(e.pointerId);touch(hit(x,y))};
canvas.onpointermove=e=>{if(!gesture||gesture.id!==e.pointerId)return;let [x,y]=point(e),dx=x-gesture.x,dy=y-gesture.y;if(Math.hypot(dx,dy)<12||performance.now()-gesture.time<190)return;touch(hit(x,y),dx>12&&Math.abs(dx)>Math.abs(dy));Object.assign(gesture,{x,y,time:performance.now()})};

lang.onclick=()=>{locale=1-locale;update()};pet.onclick=()=>touch(select.value);
function draw(t){if(until&&t>=until){react(0,0,0);until=0}let w=canvas.clientWidth,h=canvas.clientHeight,d=Math.min(devicePixelRatio,2);if(canvas.width!==Math.round(w*d)||canvas.height!==Math.round(h*d)){canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);let height=bounds[species][1]-bounds[species][0],s=Math.min(w/510,(h-20)/height,1.75),top=(h-height*s)/2;let f=motion.matches?1:Math.min(1,(t-start)/(oldPose<2&&pose<2?560:280));f=Math.max(0,f);let base=(w-512*s)/2,shift=(pose===2?f:oldPose===2?1-f:0)*Math.min(w*.035,22);transform=[s,base+shift,top];function paint(p,alpha,img=images[species][p]){if(img.complete&&img.naturalWidth){ctx.globalAlpha=alpha;ctx.drawImage(img,base+shift,top,512*s,height*s)}}if(oldPose!==pose&&oldPose<2&&pose<2&&f<1){let u=Math.round(8*(pose===1?f:1-f));paint(pose,1,[images[species][0],...tweens[species],images[species][1]][u])}else{if(f<1&&oldPose!==pose)paint(oldPose,1-f);paint(pose,f<1&&oldPose!==pose?f:1)}ctx.globalAlpha=1;requestAnimationFrame(draw)}
update();requestAnimationFrame(draw);
